[project]
name = "backend"
version = "0.0.1"
description = "HotelMate Booking Engine Copilot"

authors = [
    { name = "Pasan Wijekoon", email = "pasanhotelmate@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "agent-framework>=1.18.0",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
